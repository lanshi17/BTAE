name: btae-epe

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Check patch whitespace
        run: git diff --check
      - run: |
          mkdir -p /tmp/epe-ci
          pytest -q --junitxml=/tmp/epe-ci/pytest.xml
      - run: epe --format json policy validate
      - run: epe --format json inspect
      - run: epe --format json graph build
      - run: epe --format json architecture validate
      - run: epe --format json audit verify
      - run: epe --format json host capabilities
      - run: epe --format json host request --host local-cli --operation verify --request-id REQ-CI --task-id TASK-CI --target-entity CLASS-CI --identity-source ci
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epe-ci-evidence
          path: /tmp/epe-ci/
          if-no-files-found: warn
      - name: Verify wheel outside source tree
        run: |
          python -m pip wheel . --no-deps -w /tmp/epe-wheel
          python -m venv /tmp/epe-wheel-venv
          /tmp/epe-wheel-venv/bin/pip install /tmp/epe-wheel/*.whl
          /tmp/epe-wheel-venv/bin/python -c "from importlib.resources import files; names=('approval.schema.json','agent-request.schema.json','agent-response.schema.json','changeset-baseline.schema.json','changeset.schema.json','command-result.schema.json','contract.schema.json','entity.schema.json','evidence.schema.json','policy.schema.json','project-config.schema.json','relation.schema.json','task.schema.json','workflow.schema.json'); assert all(files('epe.data.schemas').joinpath(name).is_file() for name in names)"
          mkdir -p /tmp/epe-wheel-project
          cd /tmp/epe-wheel-project
          /tmp/epe-wheel-venv/bin/epe --format json init
          /tmp/epe-wheel-venv/bin/epe --format json policy validate
          /tmp/epe-wheel-venv/bin/epe --format json host capabilities
          /tmp/epe-wheel-venv/bin/epe --format json host request --host local-cli --operation verify --request-id REQ-WHEEL --task-id TASK-WHEEL --target-entity CLASS-WHEEL --identity-source wheel
